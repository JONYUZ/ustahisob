<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yangi parol — UstaHisob</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --paper:#F6F1E6; --card:#FFFDF9; --ink:#2A2118; --ink-soft:#6B5D4E;
  --line:#D9C9AC; --wood:#A9683C; --wood-dark:#7C4A28; --income:#3F7D53; --income-bg:#E7F0E7;
  --error:#B23B32; --error-bg:#F5E6E2;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink); padding:20px;
}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:36px 32px; width:100%; max-width:380px; box-shadow:0 4px 24px rgba(42,33,24,0.08);
}
h1{ font-family:'Zilla Slab',serif; font-size:20px; text-align:center; margin:0 0 4px; }
.sub{ text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:24px; }
label{ display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft); margin-bottom:6px; }
input{
  width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:8px;
  font-size:14px; margin-bottom:16px; font-family:inherit;
}
input:focus{ outline:2px solid var(--wood); outline-offset:1px; }
button{
  width:100%; padding:12px; border:none; border-radius:8px; background:var(--wood);
  color:#fff; font-weight:600; font-size:14px; cursor:pointer; font-family:inherit;
}
button:hover{ background:var(--wood-dark); }
button:disabled{ opacity:0.6; cursor:default; }
.msg{ font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; display:none; }
.msg.ok{ background:var(--income-bg); color:var(--income); }
.msg.err{ background:var(--error-bg); color:var(--error); }
.foot{ text-align:center; font-size:13px; margin-top:18px; color:var(--ink-soft); }
.foot a{ color:var(--wood-dark); font-weight:600; text-decoration:none; }
</style>
</head>
<body>
  <div class="card">
    <h1>USTAHISOB</h1>
    <div class="sub">Yangi parol o'rnatish</div>
    <div class="msg" id="msg"></div>
    <form id="rp-form" style="display:none;">
      <label>Yangi parol</label>
      <input id="password" type="password" required minlength="6" placeholder="Kamida 6 belgi">
      <label>Yangi parolni takrorlang</label>
      <input id="password2" type="password" required minlength="6" placeholder="Qayta kiriting">
      <button type="submit" id="submit-btn">Parolni saqlash</button>
    </form>
    <div class="foot"><a href="/login.html">Kirishga qaytish</a></div>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const msgEl = document.getElementById('msg');
const form = document.getElementById('rp-form');
const btn = document.getElementById('submit-btn');

function showMsg(text, ok){
  msgEl.textContent = text;
  msgEl.className = 'msg ' + (ok ? 'ok' : 'err');
  msgEl.style.display = 'block';
}

(async function(){
  if(!token){ showMsg("Havola noto'g'ri. Qaytadan so'rang.", false); return; }
  try{
    const res = await fetch('/api/auth/reset-password/' + encodeURIComponent(token));
    const data = await res.json();
    if(data.valid){
      form.style.display = 'block';
    } else {
      showMsg("Havola muddati tugagan yoki noto'g'ri. Qaytadan so'rang.", false);
    }
  }catch(e){
    showMsg("Tekshirishda xatolik yuz berdi.", false);
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('password').value;
  const p2 = document.getElementById('password2').value;
  if(p1 !== p2){ showMsg("Parollar mos kelmadi.", false); return; }

  btn.disabled = true; btn.textContent = 'Saqlanmoqda...';
  try{
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ token, newPassword: p1 }),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Xatolik yuz berdi');
    showMsg(data.message, true);
    form.style.display = 'none';
    setTimeout(()=>{ window.location.href = '/login.html'; }, 2000);
  }catch(err){
    showMsg(err.message, false);
    btn.disabled = false; btn.textContent = 'Parolni saqlash';
  }
});
</script>
</body>
</html>
